<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Story - TaleNexa</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a href="/" class="logo">TALENEXA</a>
        <nav class="main-nav">
            <a href="/">Home</a>
            <a href="/submit" class="active">Submit a Story</a>
            <a href="/login">Login</a>
        </nav>
    </div>
</header>
<main class="submit-page">
    <div class="submit-header">
        <p class="section-label">TALE NEXA</p>
        <h1>Submit Your Story</h1>
        <p>
            Share the story behind your AI video with the TaleNexa community.
        </p>
    </div>
    <div class="submit-box">
        <form>
            <div class="form-group">
                <label for="title">Story Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter the story title"
                    required
                >
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input
                    type="text"
                    id="author"
                    name="author"
                    placeholder="Enter the author name"
                    required
                >
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    placeholder="Write a short description of the story"
                    rows="6"
                    required
                ></textarea>
            </div>
            <div class="form-group">
                <label for="cover">Cover Image URL</label>
                <input
                    type="url"
                    id="cover"
                    name="cover"
                    placeholder="https://example.com/cover.jpg"
                >
                <small>
                    Add a direct URL to the story cover image.
                </small>
            </div>
            <div class="form-group">
                <label for="story_url">Story URL</label>
                <input
                    type="url"
                    id="story_url"
                    name="story_url"
                    placeholder="https://example.com/your-story"
                    required
                >
                <small>
                    Readers will use this link to read the full story.
                </small>
            </div>
            <button type="submit" class="submit-button">
                SUBMIT STORY
            </button>
        </form>
    </div>
</main>
<footer class="site-footer">
    <p>© 2026 TaleNexa</p>
</footer>
</body>
</html>
