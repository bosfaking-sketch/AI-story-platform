<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>TaleNexa</title>
		<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
	</head>

	<body>

		<header>
			<div class="logo">TALENEXA</div>

			<nav>
				<a href="/">Home</a>
				<a href="/submit">Submit a Story</a>
				<a href="/login">Login</a>
			</nav>
		</header>

		<main>

			<section class="hero">
				<h1>TaleNexa</h1>
				<p>Discover the stories behind the AI videos.</p>
			</section>

			<section class="stories">
				<h2>Latest Stories</h2>

				<div class="story-grid">

					<div class="story-card">
						<div class="cover">COVER IMAGE</div>

						<h3>Sample Story</h3>

						<p>This is a short description of the story.</p>

						<a href="#">Read Story</a>
					</div>

					<div class="story-card">
						<div class="cover">COVER IMAGE</div>

						<h3>Another Story</h3>

						<p>A story featured on TaleNexa.</p>

						<a href="#">Read Story</a>
					</div>

				</div>
			</section>

		</main>

		<footer>
			<p>© 2026 TaleNexa</p>
		</footer>

	</body>
</html>
